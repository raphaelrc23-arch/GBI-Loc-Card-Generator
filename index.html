<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light of the City - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://yt3.googleusercontent.com/ytc/AIdro_nr8g-CIz3sffJmD0t_A-aTvKLOAPaBzvYS-z7K6HgJuQ=s900-c-k-c0x00ffffff-no-rj');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #e8913a;
            font-size: 28px;
        }
        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(0,0,0,0.1);
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: rgba(0,0,0,0.6);
            transition: all 0.3s;
        }
        .tab.active {
            color: #e8913a;
            border-bottom: 3px solid #e8913a;
            margin-bottom: -2px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 6px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.8);
        }
        input:focus {
            outline: none;
            border-color: #e8913a;
            background: rgba(255, 255, 255, 1);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #e8913a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #d07a2a;
        }
        .hidden {
            display: none;
        }
        .message {
            text-align: center;
            font-size: 14px;
            margin-bottom: 15px;
            min-height: 20px;
        }
        .error { color: #e74c3c; }
        .success { color: #27ae60; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Light of the City</h2>
        
        <div class="tabs">
            <div class="tab active" onclick="toggleForm('login')">Login</div>
            <div class="tab" onclick="toggleForm('register')">Register</div>
        </div>

        <!-- FORM LOGIN -->
        <div id="login-section">
            <p id="login-msg" class="message"></p>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Masuk</button>
            </form>
        </div>

        <!-- FORM REGISTER -->
        <div id="register-section" class="hidden">
            <p id="register-msg" class="message"></p>
            <form id="register-form">
                <input type="text" id="reg-name" placeholder="Nama Lengkap" required>
                <input type="text" id="reg-username" placeholder="Username" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <button type="submit">Daftar</button>
            </form>
        </div>
    </div>

    <!-- Script Firestore dengan Versi 10.8.0 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            getDocs, 
            query, 
            where 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAdbzCOIjdZjo4xIKoeuPYNF8CdW59EeLw",
            authDomain: "dbjemaatloc.firebaseapp.com",
            projectId: "dbjemaatloc",
            storageBucket: "dbjemaatloc.appspot.com",
            messagingSenderId: "927587348267",
            appId: "1:927587348267:web:e1da154628ad77bdbfdf6e",
            measurementId: "G-H7Y4N3OPER"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.toggleForm = function(form) {
            const loginSec = document.getElementById('login-section');
            const registerSec = document.getElementById('register-section');
            const tabs = document.querySelectorAll('.tab');

            document.getElementById('login-msg').innerText = '';
            document.getElementById('register-msg').innerText = '';

            if (form === 'register') {
                loginSec.classList.add('hidden');
                registerSec.classList.remove('hidden');
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            } else {
                registerSec.classList.add('hidden');
                loginSec.classList.remove('hidden');
                tabs[1].classList.remove('active');
                tabs[0].classList.add('active');
            }
        };

        const regForm = document.getElementById('register-form');
        if (regForm) {
            regForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const name = document.getElementById('reg-name').value;
                const username = document.getElementById('reg-username').value;
                const password = document.getElementById('reg-password').value;
                const msg = document.getElementById('register-msg');

                try {
                    const q = query(collection(db, "users"), where("username", "==", username));
                    const querySnapshot = await getDocs(q);

                    if (!querySnapshot.empty) {
                        msg.className = 'message error';
                        msg.innerText = 'Username sudah digunakan!';
                        return;
                    }

                    await setDoc(doc(db, "users", username), {
                        name: name,
                        username: username,
                        password: password,
                        createdAt: new Date()
                    });

                    msg.className = 'message success';
                    msg.innerText = 'Registrasi berhasil! Silakan login.';
                    this.reset();
                    setTimeout(() => window.toggleForm('login'), 1500);

                } catch (error) {
                    msg.className = 'message error';
                    msg.innerText = 'Gagal Daftar: ' + error.message;
                }
            });
        }

        const loginForm = document.getElementById('login-form');
        if (loginForm) {
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = document.getElementById('login-username').value;
                const password = document.getElementById('login-password').value;
                const msg = document.getElementById('login-msg');

                try {
                    const q = query(
                        collection(db, "users"), 
                        where("username", "==", username),
                        where("password", "==", password)
                    );
                    const querySnapshot = await getDocs(q);

                    if (!querySnapshot.empty) {
                        msg.className = 'message success';
                        msg.innerText = 'Login berhasil! Mengalihkan...';

                        sessionStorage.setItem('loggedUser', username);

                        setTimeout(() => {
                            window.location.href = 'homepage.html';
                        }, 1000);
                    } else {
                        msg.className = 'message error';
                        msg.innerText = 'Username atau Password salah!';
                    }

                } catch (error) {
                    msg.className = 'message error';
                    msg.innerText = 'Terjadi kesalahan: ' + error.message;
                }
            });
        }
    </script>
</body>
</html>
