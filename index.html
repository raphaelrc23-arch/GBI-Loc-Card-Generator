<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light of the City - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://yt3.googleusercontent.com/ytc/AIdro_nr8g-CIz3sffJmD0t_A-aTvKLOAPaBzvYS-z7K6HgJuQ=s900-c-k-c0x00ffffff-no-rj');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #e8913a;
            font-size: 28px;
        }
        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(0,0,0,0.1);
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: rgba(0,0,0,0.6);
            transition: all 0.3s;
        }
        .tab.active {
            color: #e8913a;
            border-bottom: 3px solid #e8913a;
            margin-bottom: -2px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 6px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.8);
        }
        input:focus {
            outline: none;
            border-color: #e8913a;
            background: rgba(255, 255, 255, 1);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #e8913a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #d07a2a;
        }
        .hidden {
            display: none;
        }
        .message {
            text-align: center;
            font-size: 14px;
            margin-bottom: 15px;
            min-height: 20px;
        }
        .error { color: #e74c3c; }
        .success { color: #27ae60; }
    </style>
</head>
<body>


<!-- Script Firebase SDK (Modular Version) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword 
        } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc 
        } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js";

        // ==========================================
        // MASUKKAN KONFIGURASI FIREBASE ANDA DI SINI
        // ==========================================
        const firebaseConfig = {
            apiKey: "GANTI_DENGAN_API_KEY_ANDA",
            authDomain: "GANTI_DENGAN_AUTH_DOMAIN_ANDA",
            projectId: "GANTI_DENGAN_PROJECT_ID_ANDA",
            storageBucket: "GANTI_DENGAN_STORAGE_BUCKET_ANDA",
            messagingSenderId: "GANTI_DENGAN_MESSAGING_SENDER_ID_ANDA",
            appId: "GANTI_DENGAN_APP_ID_ANDA"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Fungsi Toggle Form (Login / Register)
        window.toggleForm = function(form) {
            const loginSec = document.getElementById('login-section');
            const registerSec = document.getElementById('register-section');
            const tabs = document.querySelectorAll('.tab');

            document.getElementById('login-msg').innerText = '';
            document.getElementById('register-msg').innerText = '';

            if (form === 'register') {
                loginSec.classList.add('hidden');
                registerSec.classList.remove('hidden');
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            } else {
                registerSec.classList.add('hidden');
                loginSec.classList.remove('hidden');
                tabs[1].classList.remove('active');
                tabs[0].classList.add('active');
            }
        }

        // REGISTER DENGAN FIREBASE AUTH
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            // Catatan: Firebase Auth menggunakan format Email untuk username/login standar
            const email = document.getElementById('reg-username').value; 
            const password = document.getElementById('reg-password').value;
            const msg = document.getElementById('register-msg');

            try {
                // 1. Buat akun di Firebase Authentication
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Simpan nama lengkap tambahan ke Cloud Firestore
                await setDoc(doc(db, "users", user.uid), {
                    name: name,
                    email: email,
                    createdAt: new Date()
                });

                msg.className = 'message success';
                msg.innerText = 'Registrasi berhasil! Silakan login.';
                this.reset();
                setTimeout(() => window.toggleForm('login'), 1500);

            } catch (error) {
                msg.className = 'message error';
                msg.innerText = 'Gagal Daftar: ' + error.message;
            }
        });

        // LOGIN DENGAN FIREBASE AUTH
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const msg = document.getElementById('login-msg');

            try {
                // Proses login ke Firebase
                await signInWithEmailAndPassword(auth, email, password);
                
                msg.className = 'message success';
                msg.innerText = 'Login berhasil! Mengalihkan...';

                // Pindah ke homepage.html setelah berhasil login
                setTimeout(() => {
                    window.location.href = 'homepage.html';
                }, 1000);

            } catch (error) {
                msg.className = 'message error';
                msg.innerText = 'Username atau Password salah!';
            }
        });
    </script>


    <div class="container">
        <h2>Light of the City</h2>
        
        <div class="tabs">
            <div class="tab active" onclick="toggleForm('login')">Login</div>
            <div class="tab" onclick="toggleForm('register')">Register</div>
        </div>

        <!-- FORM LOGIN -->
        <div id="login-section">
            <p id="login-msg" class="message"></p>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Masuk</button>
            </form>
        </div>

        <!-- FORM REGISTER -->
        <div id="register-section" class="hidden">
            <p id="register-msg" class="message"></p>
            <form id="register-form">
                <input type="text" id="reg-name" placeholder="Nama Lengkap" required>
                <input type="text" id="reg-username" placeholder="Username" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <button type="submit">Daftar</button>
            </form>
        </div>
    </div>

    <script>
        function toggleForm(form) {
            const loginSec = document.getElementById('login-section');
            const registerSec = document.getElementById('register-section');
            const tabs = document.querySelectorAll('.tab');

            document.getElementById('login-msg').innerText = '';
            document.getElementById('register-msg').innerText = '';

            if (form === 'register') {
                loginSec.classList.add('hidden');
                registerSec.classList.remove('hidden');
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            } else {
                registerSec.classList.add('hidden');
                loginSec.classList.remove('hidden');
                tabs[1].classList.remove('active');
                tabs[0].classList.add('active');
            }
        }

        // REGISTER
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const msg = document.getElementById('register-msg');

            let users = JSON.parse(localStorage.getItem('users')) || [];

            if (users.find(u => u.username === username)) {
                msg.className = 'message error';
                msg.innerText = 'Username sudah digunakan!';
                return;
            }

            users.push({ name, username, password });
            localStorage.setItem('users', JSON.stringify(users));

            msg.className = 'message success';
            msg.innerText = 'Registrasi berhasil! Silakan login.';
            this.reset();
            setTimeout(() => toggleForm('login'), 1500);
        });

        // LOGIN
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const msg = document.getElementById('login-msg');

            let users = JSON.parse(localStorage.getItem('users')) || [];
            const user = users.find(u => u.username === username && u.password === password);

            if (user) {
                msg.className = 'message success';
                msg.innerText = `Login berhasil! Selamat datang, ${user.name}.`;
            } else {
                msg.className = 'message error';
                msg.innerText = 'Username atau Password salah!';
            }
        });
    </script>
</body>
</html>
