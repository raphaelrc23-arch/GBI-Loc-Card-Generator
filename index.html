<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light of the City - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://yt3.googleusercontent.com/ytc/AIdro_nr8g-CIz3sffJmD0t_A-aTvKLOAPaBzvYS-z7K6HgJuQ=s900-c-k-c0x00ffffff-no-rj');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #e8913a;
            font-size: 28px;
        }
        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(0,0,0,0.1);
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: rgba(0,0,0,0.6);
            transition: all 0.3s;
        }
        .tab.active {
            color: #e8913a;
            border-bottom: 3px solid #e8913a;
            margin-bottom: -2px;
        }
        .tab:hover {
            color: #e8913a;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 6px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.8);
        }
        input:focus {
            outline: none;
            border-color: #e8913a;
            background: rgba(255, 255, 255, 1);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #e8913a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #d07a2a;
        }
        .hidden {
            display: none !important;
        }
        .message {
            text-align: center;
            font-size: 14px;
            margin-bottom: 15px;
            min-height: 20px;
            padding: 8px;
            border-radius: 4px;
        }
        .error { 
            color: #721c24; 
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
        .success { 
            color: #155724; 
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Light of the City</h2>
        
        <div class="tabs">
            <div class="tab active" id="tab-login" onclick="showLogin()">Login</div>
            <div class="tab" id="tab-register" onclick="showRegister()">Register</div>
        </div>

        <!-- FORM LOGIN -->
        <div id="login-section">
            <div id="login-msg" class="message" style="display:none;"></div>
            <form id="login-form" onsubmit="handleLogin(event)">
                <input type="text" id="login-username" placeholder="Username" required autocomplete="username">
                <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                <button type="submit">Masuk</button>
            </form>
        </div>

        <!-- FORM REGISTER -->
        <div id="register-section" class="hidden">
            <div id="register-msg" class="message" style="display:none;"></div>
            <form id="register-form" onsubmit="handleRegister(event)">
                <input type="text" id="reg-name" placeholder="Nama Lengkap" required autocomplete="name">
                <input type="text" id="reg-username" placeholder="Username" required autocomplete="username">
                <input type="password" id="reg-password" placeholder="Password" required autocomplete="new-password">
                <button type="submit">Daftar</button>
            </form>
        </div>
    </div>

    <script>
        // Fungsi untuk menampilkan form Login
        function showLogin() {
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('tab-login').classList.add('active');
            document.getElementById('tab-register').classList.remove('active');
            clearMessages();
        }

        // Fungsi untuk menampilkan form Register
        function showRegister() {
            document.getElementById('register-section').classList.remove('hidden');
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('tab-register').classList.add('active');
            document.getElementById('tab-login').classList.remove('active');
            clearMessages();
        }

        // Clear semua pesan
        function clearMessages() {
            const loginMsg = document.getElementById('login-msg');
            const registerMsg = document.getElementById('register-msg');
            loginMsg.style.display = 'none';
            loginMsg.className = 'message';
            registerMsg.style.display = 'none';
            registerMsg.className = 'message';
        }

        // Show message helper
        function showMessage(elementId, text, type) {
            const msgEl = document.getElementById(elementId);
            msgEl.textContent = text;
            msgEl.className = 'message ' + type;
            msgEl.style.display = 'block';
        }

        // HANDLE REGISTER
        function handleRegister(e) {
            e.preventDefault();
            
            const name = document.getElementById('reg-name').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;

            console.log('Register attempt:', { name, username });

            // Ambil data user dari localStorage
            let users = [];
            try {
                const storedUsers = localStorage.getItem('users');
                if (storedUsers) {
                    users = JSON.parse(storedUsers);
                }
            } catch (error) {
                console.error('Error reading localStorage:', error);
                users = [];
            }

            // Cek apakah username sudah ada
            const userExists = users.find(u => u.username.toLowerCase() === username.toLowerCase());
            
            if (userExists) {
                showMessage('register-msg', '❌ Username sudah digunakan! Coba username lain.', 'error');
                return;
            }

            // Simpan user baru
            users.push({ 
                name: name, 
                username: username, 
                password: password,
                createdAt: new Date().toISOString()
            });
            
            localStorage.setItem('users', JSON.stringify(users));
            
            console.log('User registered successfully. Total users:', users.length);
            
            showMessage('register-msg', '✅ Registrasi berhasil! Silakan login.', 'success');
            
            // Reset form
            document.getElementById('register-form').reset();
            
            // Pindah ke login setelah 2 detik
            setTimeout(() => {
                showLogin();
            }, 2000);
        }

        // HANDLE LOGIN
        function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            console.log('Login attempt:', username);

            // Ambil data user
            let users = [];
            try {
                const storedUsers = localStorage.getItem('users');
                if (storedUsers) {
                    users = JSON.parse(storedUsers);
                }
            } catch (error) {
                console.error('Error reading localStorage:', error);
            }

            console.log('Total users in database:', users.length);

            // Cari user
            const user = users.find(u => 
                u.username.toLowerCase() === username.toLowerCase() && 
                u.password === password
            );

            if (user) {
                showMessage('login-msg', `✅ Login berhasil! Selamat datang, ${user.name}!`, 'success');
                console.log('Login successful:', user.name);
                
                // Simpan user yang sedang login
                localStorage.setItem('currentUser', JSON.stringify(user));
                
                // Optional: Redirect setelah 1 detik
                // setTimeout(() => {
                //     window.location.href = 'dashboard.html';
                // }, 1000);
            } else {
                showMessage('login-msg', '❌ Username atau password salah!', 'error');
                console.log('Login failed: User not found or wrong password');
                
                // Shake effect untuk feedback visual
                const container = document.querySelector('.container');
                container.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    container.style.animation = '';
                }, 500);
            }
        }

        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);

        // Debug: Tampilkan data users di console
        console.log('=== LIGHT OF THE CITY LOGIN SYSTEM ===');
        console.log('LocalStorage users:', localStorage.getItem('users'));
    </script>
</body>
</html>
